{{/*
Attachment tab content — rendered when the "attachments" tab is active on a detail page.
Data: .AttachmentTable (TableConfig — its PrimaryAction carries the Upload CTA)
*/}}
{{define "attachment-tab"}}
<div class="attachment-tab-content">
    {{if .AttachmentTable}}
        {{template "table-card" .AttachmentTable}}
    {{end}}
</div>
{{end}}
