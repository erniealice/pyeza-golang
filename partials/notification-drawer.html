{{define "notification-sheet"}}
<!-- Notification Sheet -->
<div class="notification-overlay" id="notificationOverlay"></div>
<aside class="notification-sheet" id="notificationSheet">
    <div class="notification-drawer-header">
        <h2 class="notification-drawer-title">{{.T "notifications.title"}}</h2>
        <div class="notification-drawer-actions">
            <button class="notification-mark-all" id="markAllRead" title="{{.T "notifications.markAllRead"}}">
                {{template "icon-check-square"}}
                <span>{{.T "notifications.markAllRead"}}</span>
            </button>
            <button class="notification-close-btn" id="notificationCloseBtn" aria-label="{{.T "notifications.close"}}">
                {{template "icon-x"}}
            </button>
        </div>
    </div>

    <div class="notification-tabs">
        <button class="notification-tab active" data-filter="all">{{.T "notifications.tabs.all"}}</button>
        <button class="notification-tab" data-filter="unread">{{.T "notifications.tabs.unread"}}</button>
        <button class="notification-tab" data-filter="alert">{{.T "notifications.tabs.alerts"}}</button>
    </div>

    <div class="notification-list" id="notificationList">
        <!-- Loading state -->
        <div class="notification-loading" id="notificationLoading">
            <div class="notification-spinner"></div>
            <span>{{.T "notifications.loading"}}</span>
        </div>

        <!-- Empty state (hidden by default) -->
        <div class="notification-empty" id="notificationEmpty" style="display: none;">
            <div class="notification-empty-icon">
                {{template "icon-bell"}}
            </div>
            <h3>{{.T "notifications.empty.title"}}</h3>
            <p>{{.T "notifications.empty.message"}}</p>
        </div>

        <!-- Notifications will be rendered here -->
        <div id="notificationItems"></div>
    </div>

    <div class="notification-sheet-footer">
        <a href="/notifications" class="notification-view-all">
            {{.T "notifications.viewAll"}}
            {{template "icon-arrow-right"}}
        </a>
    </div>
</aside>

<!-- Notification Sheet Script -->
<script src="/assets/js/components/notification-sheet.js"></script>
{{end}}
