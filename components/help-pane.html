{{define "help-pane"}}
{{if .HasHelp}}
<aside class="help-pane" id="helpPane" aria-label="Help content">
    <div class="help-pane-header">
        <div class="help-pane-title">
            {{template "icon-help" .}}
            <span>{{.T "helpPane.title"}}</span>
        </div>
        <button class="help-pane-close" id="helpPaneClose" aria-label="{{.T "helpPane.close"}}">
            {{template "icon-x" .}}
        </button>
    </div>
    <div class="help-pane-content markdown-content">
        {{.HelpContent}}
    </div>
</aside>
{{end}}
{{end}}
